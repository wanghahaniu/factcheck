<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事实核查引擎</title>
<style>
:root {
  --bg: #0d0f14;
  --bg-card: #13161e;
  --bg-input: #1a1d27;
  --border: #252836;
  --border-hover: #3a3d52;
  --text-primary: #e8eaf0;
  --text-secondary: #9ba3b8;
  --text-muted: #5a6070;
  --blue: #4a9eff;
  --blue-dim: rgba(74,158,255,0.12);
  --green: #3dd68c;
  --green-dim: rgba(61,214,140,0.12);
  --yellow: #f5c842;
  --yellow-dim: rgba(245,200,66,0.12);
  --red: #ff5252;
  --red-dim: rgba(255,82,82,0.12);
  --orange: #ff8c42;
  --orange-dim: rgba(255,140,66,0.12);
  --purple: #a78bfa;
  --purple-dim: rgba(167,139,250,0.12);
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== LAYOUT ===== */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 20px 16px;
  overflow-y: auto;
}
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

/* ===== SIDEBAR ===== */
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.logo-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.logo-text { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.logo-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }

.sidebar-section { margin-bottom: 24px; }
.sidebar-label {
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px;
}

.api-input-wrap { position: relative; }
.api-input {
  width: 100%; padding: 8px 32px 8px 10px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text-primary);
  font-size: 12px; font-family: monospace;
  outline: none; transition: border-color 0.2s;
}
.api-input:focus { border-color: var(--blue); }
.api-toggle {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; font-size: 13px; padding: 2px;
}

.category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cat-btn {
  padding: 6px 8px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-muted); font-size: 11px; font-weight: 500;
  cursor: pointer; text-align: center; transition: all 0.15s;
}
.cat-btn:hover { border-color: var(--border-hover); color: var(--text-secondary); }
.cat-btn.active { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }

.history-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
.history-item {
  padding: 8px 10px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: border-color 0.15s;
}
.history-item:hover { border-color: var(--blue); }
.history-item-title { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item-meta { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.history-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px 0; }

/* ===== MAIN CONTENT ===== */
.content { flex: 1; padding: 32px 40px; max-width: 900px; margin: 0 auto; width: 100%; }

/* ===== INPUT PANEL ===== */
.input-panel { }
.panel-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.panel-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }

.input-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.input-tab {
  padding: 7px 18px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 20px;
  color: var(--text-muted); font-size: 13px; cursor: pointer;
  transition: all 0.15s;
}
.input-tab:hover { border-color: var(--border-hover); color: var(--text-secondary); }
.input-tab.active { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }

.text-input-area {
  width: 100%; min-height: 160px; padding: 16px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text-primary);
  font-size: 14px; font-family: inherit; line-height: 1.7;
  resize: vertical; outline: none; transition: border-color 0.2s;
}
.text-input-area:focus { border-color: var(--blue); }
.text-input-area::placeholder { color: var(--text-muted); }

.image-upload-area {
  width: 100%; min-height: 160px; padding: 32px;
  background: var(--bg-input); border: 2px dashed var(--border);
  border-radius: var(--radius); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; transition: all 0.2s; position: relative;
}
.image-upload-area:hover, .image-upload-area.drag-over {
  border-color: var(--blue); background: var(--blue-dim);
}
.upload-icon { font-size: 36px; opacity: 0.5; }
.upload-text { font-size: 14px; color: var(--text-secondary); }
.upload-hint { font-size: 12px; color: var(--text-muted); }
.upload-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.image-preview {
  width: 100%; max-height: 300px; object-fit: contain;
  border-radius: 6px; display: none;
}

.input-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
.char-count { font-size: 12px; color: var(--text-muted); }
.check-btn {
  padding: 10px 28px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border: none; border-radius: var(--radius);
  color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
  display: flex; align-items: center; gap: 8px;
}
.check-btn:hover { opacity: 0.9; }
.check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== PROGRESS ===== */
.progress-panel { display: none; }
.progress-title { font-size: 18px; font-weight: 600; margin-bottom: 24px; }
.steps { display: flex; flex-direction: column; gap: 12px; }
.step {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
  transition: all 0.3s;
}
.step.active { border-color: var(--blue); background: var(--blue-dim); }
.step.done { border-color: var(--green); background: var(--green-dim); }
.step.error { border-color: var(--red); background: var(--red-dim); }
.step-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.step-info { flex: 1; }
.step-name { font-size: 13px; font-weight: 600; }
.step-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.step-status { font-size: 12px; color: var(--text-muted); }
.step.active .step-status { color: var(--blue); }
.step.done .step-status { color: var(--green); }

.spinner {
  width: 16px; height: 16px; border: 2px solid var(--border);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== REPORT ===== */
.report-panel { display: none; }
.report-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 28px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.report-title-area { }
.report-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.report-meta { display: flex; gap: 16px; flex-wrap: wrap; }
.report-meta-item { font-size: 12px; color: var(--text-muted); }
.report-meta-item span { color: var(--text-secondary); }

.verdict-badge {
  padding: 8px 20px; border-radius: 20px;
  font-size: 14px; font-weight: 700; white-space: nowrap;
  flex-shrink: 0;
}
.verdict-high { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
.verdict-partial { background: var(--yellow-dim); color: var(--yellow); border: 1px solid var(--yellow); }
.verdict-doubt { background: var(--orange-dim); color: var(--orange); border: 1px solid var(--orange); }
.verdict-false { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
.verdict-unknown { background: var(--purple-dim); color: var(--purple); border: 1px solid var(--purple); }

.report-section { margin-bottom: 28px; }
.section-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.section-icon { font-size: 16px; }
.section-title { font-size: 15px; font-weight: 700; }
.section-count {
  margin-left: auto; font-size: 11px; color: var(--text-muted);
  background: var(--bg-input); padding: 2px 8px; border-radius: 10px;
}

/* 原消息 */
.original-text {
  padding: 16px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; line-height: 1.8; color: var(--text-secondary);
  white-space: pre-wrap; word-break: break-all;
}

/* 主张列表 */
.claims-list { display: flex; flex-direction: column; gap: 10px; }
.claim-item {
  display: flex; gap: 12px; padding: 14px 16px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.claim-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--blue-dim); border: 1px solid var(--blue);
  color: var(--blue); font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.claim-body { flex: 1; }
.claim-text { font-size: 13px; color: var(--text-primary); margin-bottom: 6px; }
.claim-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
.status-confirmed { background: var(--green-dim); color: var(--green); }
.status-doubt { background: var(--yellow-dim); color: var(--yellow); }
.status-insufficient { background: var(--purple-dim); color: var(--purple); }
.status-false { background: var(--red-dim); color: var(--red); }

/* 证据区块 */
.evidence-block {
  padding: 14px 16px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 10px;
}
.evidence-block.confirmed { border-left: 3px solid var(--green); }
.evidence-block.doubt { border-left: 3px solid var(--yellow); }
.evidence-block.insufficient { border-left: 3px solid var(--purple); }
.evidence-claim { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
.evidence-detail { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }

/* 来源表格 */
.sources-table { width: 100%; border-collapse: collapse; }
.sources-table th {
  text-align: left; padding: 10px 12px;
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
}
.sources-table td {
  padding: 10px 12px; font-size: 12px;
  border-bottom: 1px solid var(--border); vertical-align: top;
}
.sources-table tr:last-child td { border-bottom: none; }
.source-name { color: var(--text-primary); font-weight: 500; }
.source-link { color: var(--blue); text-decoration: none; font-size: 11px; }
.source-link:hover { text-decoration: underline; }
.source-tier {
  display: inline-block; padding: 1px 7px; border-radius: 8px;
  font-size: 10px; font-weight: 600;
}
.tier-1 { background: var(--green-dim); color: var(--green); }
.tier-2 { background: var(--blue-dim); color: var(--blue); }
.tier-3 { background: var(--yellow-dim); color: var(--yellow); }
.tier-4 { background: var(--red-dim); color: var(--red); }
.support-yes { color: var(--green); font-weight: 600; }
.support-no { color: var(--red); font-weight: 600; }
.support-partial { color: var(--yellow); font-weight: 600; }

/* 评分 */
.score-panel {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-bottom: 16px;
}
.score-item {
  padding: 14px 16px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.score-label { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.score-bar-wrap { display: flex; align-items: center; gap: 10px; }
.score-bar-bg {
  flex: 1; height: 6px; background: var(--border);
  border-radius: 3px; overflow: hidden;
}
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
.score-val { font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; }
.score-total {
  padding: 16px 20px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: space-between;
}
.score-total-label { font-size: 14px; font-weight: 600; }
.score-total-val { font-size: 28px; font-weight: 800; }

/* 结论 */
.conclusion-box {
  padding: 20px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.conclusion-verdict { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.conclusion-reasons { display: flex; flex-direction: column; gap: 8px; }
.conclusion-reason {
  display: flex; gap: 10px; font-size: 13px; color: var(--text-secondary);
}
.reason-num { color: var(--blue); font-weight: 700; flex-shrink: 0; }

/* 反向建议 */
.suggestions-list { display: flex; flex-direction: column; gap: 8px; }
.suggestion-item {
  display: flex; gap: 10px; padding: 12px 14px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; color: var(--text-secondary);
}
.suggestion-icon { flex-shrink: 0; }

/* 报告操作栏 */
.report-actions {
  display: flex; gap: 10px; margin-top: 32px; padding-top: 20px;
  border-top: 1px solid var(--border);
}
.action-btn {
  padding: 9px 20px; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  transition: all 0.15s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border: none; color: #fff;
}
.btn-primary:hover { opacity: 0.9; }
.btn-secondary {
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-secondary);
}
.btn-secondary:hover { border-color: var(--border-hover); color: var(--text-primary); }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* ===== PRINT / PDF ===== */
@media print {
  /* 布局 */
  .sidebar, .input-panel, .progress-panel, .report-actions { display: none !important; }
  .app { display: block !important; height: auto !important; overflow: visible !important; }
  .main { overflow: visible !important; height: auto !important; display: block !important; }
  .report-panel {
    display: block !important; overflow: visible !important;
    height: auto !important; padding: 24px 32px !important;
    background: #fff !important;
  }

  /* 全局字体与背景 */
  body, * {
    background: #fff !important;
    color: #1a1a2e !important;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* 报告头 */
  .report-header {
    border-bottom: 2px solid #1a1a2e !important;
    padding-bottom: 16px !important;
    margin-bottom: 24px !important;
  }
  .report-title { font-size: 22px !important; color: #1a1a2e !important; }
  .report-meta-item { color: #555 !important; }
  .report-meta-item span { color: #1a1a2e !important; }

  /* 结论徽章 */
  .verdict-high   { background: #e6f9f0 !important; color: #1a7a4a !important; border: 1.5px solid #1a7a4a !important; }
  .verdict-partial{ background: #fffbe6 !important; color: #8a6d00 !important; border: 1.5px solid #c9a800 !important; }
  .verdict-doubt  { background: #fff3e6 !important; color: #a04800 !important; border: 1.5px solid #e07000 !important; }
  .verdict-false  { background: #ffeaea !important; color: #a00000 !important; border: 1.5px solid #cc0000 !important; }
  .verdict-unknown{ background: #f0eeff !important; color: #4a3a9a !important; border: 1.5px solid #7060cc !important; }

  /* 分区标题 */
  .section-header { border-bottom: 1px solid #ddd !important; }
  .section-title { color: #1a1a2e !important; font-size: 14px !important; }
  .section-count { background: #f0f0f0 !important; color: #555 !important; }

  /* 原始内容 */
  .original-text {
    background: #f8f8f8 !important; border: 1px solid #ddd !important;
    color: #333 !important; font-size: 13px !important; line-height: 1.8 !important;
  }

  /* 主张卡片 */
  .claim-item {
    background: #fafafa !important; border: 1px solid #ddd !important;
    page-break-inside: avoid; break-inside: avoid;
  }
  .claim-num { background: #e8f0ff !important; border-color: #4a7adf !important; color: #2a5abf !important; }
  .claim-text { color: #1a1a2e !important; font-size: 13px !important; }

  /* 主张状态标签 */
  .status-confirmed { background: #e6f9f0 !important; color: #1a7a4a !important; }
  .status-doubt     { background: #fffbe6 !important; color: #8a6d00 !important; }
  .status-insufficient { background: #f0eeff !important; color: #4a3a9a !important; }
  .status-false     { background: #ffeaea !important; color: #a00000 !important; }

  /* 来源依据框 */
  .claim-item [style*="background:var(--bg)"] {
    background: #f5f5f5 !important;
    border-color: #ccc !important;
  }

  /* 证据区块 */
  .evidence-block { background: #fafafa !important; border-color: #ddd !important; }
  .evidence-block.confirmed { border-left-color: #1a7a4a !important; }
  .evidence-block.doubt     { border-left-color: #c9a800 !important; }
  .evidence-block.insufficient { border-left-color: #7060cc !important; }
  .evidence-detail { color: #333 !important; }

  /* 来源表格 */
  .sources-table th { color: #555 !important; border-bottom-color: #ccc !important; font-size: 11px !important; }
  .sources-table td { border-bottom-color: #eee !important; color: #333 !important; }
  .sources-table tr { page-break-inside: avoid; break-inside: avoid; }
  .source-name { color: #1a1a2e !important; }
  .source-link { color: #2a5abf !important; }
  .tier-1 { background: #e6f9f0 !important; color: #1a7a4a !important; }
  .tier-2 { background: #e8f0ff !important; color: #2a5abf !important; }
  .tier-3 { background: #fffbe6 !important; color: #8a6d00 !important; }
  .support-yes     { color: #1a7a4a !important; }
  .support-no      { color: #a00000 !important; }
  .support-partial { color: #8a6d00 !important; }

  /* 评分 */
  .score-item { background: #fafafa !important; border-color: #ddd !important; }
  .score-label { color: #555 !important; }
  .score-bar-bg { background: #e0e0e0 !important; }
  .score-total { background: #f0f0f0 !important; border-color: #ddd !important; }
  .score-total-label { color: #1a1a2e !important; }

  /* 结论 */
  .conclusion-box { background: #fafafa !important; border-color: #ddd !important; }
  .conclusion-reason { color: #333 !important; }
  .reason-num { color: #2a5abf !important; }

  /* 建议 */
  .suggestion-item { background: #fafafa !important; border-color: #ddd !important; color: #333 !important; }

  /* 冲突区块 */
  .report-section [style*="border: 1px solid var(--orange)"] {
    border-color: #e07000 !important;
    background: #fff8f0 !important;
  }

  /* 摘要卡片数字 */
  a { color: #2a5abf !important; }

  .report-section { page-break-inside: avoid; break-inside: avoid; margin-bottom: 20px !important; }
}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <div>
        <div class="logo-text">事实核查引擎</div>
        <div class="logo-sub">FACT CHECK ENGINE</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">API 配置</div>
      <div class="api-input-wrap" style="margin-bottom:8px">
        <input type="password" class="api-input" id="apiKey" placeholder="智谱 GLM API Key">
        <button class="api-toggle" onclick="toggleApiKey('apiKey')">👁</button>
      </div>
      <div class="api-input-wrap">
        <input type="password" class="api-input" id="tavilyKey" placeholder="Tavily API Key（真实搜索）">
        <button class="api-toggle" onclick="toggleApiKey('tavilyKey')">👁</button>
      </div>
      <div style="font-size:10px;color:var(--text-muted);margin-top:6px;line-height:1.5">
        填入 Tavily Key 后启用真实联网检索<br>
        <a href="https://app.tavily.com" target="_blank" style="color:var(--blue);text-decoration:none">→ 免费注册 tavily.com</a>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">核查类型</div>
      <div class="category-grid">
        <button class="cat-btn active" data-cat="auto" onclick="selectCat(this)">🤖 自动识别</button>
        <button class="cat-btn" data-cat="military" onclick="selectCat(this)">⚔️ 军事</button>
        <button class="cat-btn" data-cat="finance" onclick="selectCat(this)">📈 金融</button>
        <button class="cat-btn" data-cat="energy" onclick="selectCat(this)">⚡ 能源</button>
        <button class="cat-btn" data-cat="social" onclick="selectCat(this)">👥 社会</button>
        <button class="cat-btn" data-cat="policy" onclick="selectCat(this)">📋 政策</button>
      </div>
    </div>

    <div class="sidebar-section" style="flex:1">
      <div class="sidebar-label">历史记录</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">暂无记录</div>
      </div>
    </div>

    <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:12px;border-top:1px solid var(--border)">
      Powered by 智谱 GLM-5 · 仅供参考
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <div class="content">

      <!-- 输入面板 -->
      <div class="input-panel" id="inputPanel">
        <div class="panel-title">信息真伪核查</div>
        <div class="panel-sub">输入文字或上传截图，系统自动拆解主张、多源交叉验证，生成结构化核查报告</div>

        <div class="input-tabs">
          <button class="input-tab active" onclick="switchInputTab('text', this)">📝 文字输入</button>
          <button class="input-tab" onclick="switchInputTab('image', this)">🖼 图片上传</button>
        </div>

        <!-- 文字输入 -->
        <div id="textInputArea">
          <textarea class="text-input-area" id="textInput"
            placeholder="粘贴需要核查的文字内容，例如：&#10;&#10;• 新闻报道&#10;• 社交媒体传言&#10;• 聊天截图中的文字&#10;• 任何需要验证真实性的信息"
            oninput="updateCharCount()"></textarea>
          <div class="input-footer">
            <span class="char-count" id="charCount">0 字</span>
            <button class="check-btn" id="checkBtn" onclick="startCheck()">
              <span>开始核查</span> <span>→</span>
            </button>
          </div>
        </div>

        <!-- 图片上传 -->
        <div id="imageInputArea" style="display:none">
          <div class="image-upload-area" id="uploadArea"
            ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
            <input type="file" class="upload-input" id="imageInput" accept="image/*" onchange="handleImageSelect(event)">
            <div id="uploadPlaceholder">
              <div class="upload-icon">📷</div>
              <div class="upload-text">点击上传或拖拽图片到此处</div>
              <div class="upload-hint">支持 JPG、PNG、WebP · 最大 10MB</div>
            </div>
            <img class="image-preview" id="imagePreview">
          </div>
          <div class="input-footer">
            <span class="char-count" id="imageStatus">未选择图片</span>
            <button class="check-btn" id="checkBtnImg" onclick="startCheck()" disabled>
              <span>开始核查</span> <span>→</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 进度面板 -->
      <div class="progress-panel" id="progressPanel">
        <div class="progress-title">正在核查中...</div>
        <div class="steps" id="stepsList"></div>

      <!-- 报告面板 -->
      <div class="report-panel" id="reportPanel"></div>

    </div>

<script>
// ===== 状态 =====
let state = {
  inputMode: 'text',
  category: 'auto',
  imageBase64: null,
  imageFile: null,
  imageMime: null,
  history: JSON.parse(localStorage.getItem('fce_history') || '[]')
};

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('fce_apikey');
  if (saved) document.getElementById('apiKey').value = saved;
  const savedTavily = localStorage.getItem('fce_tavilykey');
  if (savedTavily) document.getElementById('tavilyKey').value = savedTavily;
  renderHistory();
});

// ===== UI 交互 =====
function toggleApiKey(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function selectCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.category = btn.dataset.cat;
}

function switchInputTab(mode, btn) {
  state.inputMode = mode;
  document.querySelectorAll('.input-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('textInputArea').style.display = mode === 'text' ? 'block' : 'none';
  document.getElementById('imageInputArea').style.display = mode === 'image' ? 'block' : 'none';
}

function updateCharCount() {
  const v = document.getElementById('textInput').value;
  document.getElementById('charCount').textContent = v.length + ' 字';
}

// ===== 图片处理 =====
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.add('drag-over');
}
function handleDragLeave(e) {
  document.getElementById('uploadArea').classList.remove('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) processImage(file);
}
function handleImageSelect(e) {
  const file = e.target.files[0];
  if (file) {
    processImage(file);
    e.target.value = ''; // 重置，允许重复选同一文件
  }
}
function processImage(file) {
  state.imageFile = file;
  state.imageMime = 'image/jpeg'; // 统一转 JPEG 发送，兼容性最好
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      // 压缩：最大边 1024px
      const MAX = 1024;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      state.imageBase64 = dataUrl.split(',')[1];
      const preview = document.getElementById('imagePreview');
      preview.src = dataUrl;
      preview.style.display = 'block';
      document.getElementById('uploadPlaceholder').style.display = 'none';
      document.getElementById('imageStatus').textContent = file.name + ' (' + (file.size/1024).toFixed(0) + 'KB → 已压缩)';
      document.getElementById('checkBtnImg').disabled = false;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== 历史记录 =====
function saveHistory(title, verdict, score) {
  state.history.unshift({ title, verdict, score, time: new Date().toLocaleString('zh-CN') });
  if (state.history.length > 20) state.history.pop();
  localStorage.setItem('fce_history', JSON.stringify(state.history));
  renderHistory();
}
function renderHistory() {
  const el = document.getElementById('historyList');
  if (!state.history.length) {
    el.innerHTML = '<div class="history-empty">暂无记录</div>';
    return;
  }
  el.innerHTML = state.history.map((h, i) => `
    <div class="history-item" onclick="showHistoryItem(${i})">
      <div class="history-item-title">${h.title}</div>
      <div class="history-item-meta">${h.verdict} · ${h.score}分 · ${h.time}</div>
    </div>
  `).join('');
}

// ===== 面板切换 =====
function showPanel(name) {
  ['inputPanel','progressPanel','reportPanel'].forEach(id => {
    document.getElementById(id).style.display = id === name ? 'block' : 'none';
  });
}

// ===== 步骤定义 =====
const STEPS = [
  { id: 'extract', icon: '📄', name: '提取内容', desc: '识别输入类型，提取文字信息' },
  { id: 'claims',  icon: '🔬', name: '拆解主张', desc: '将内容分解为可验证的独立子主张' },
  { id: 'queries', icon: '🔎', name: '生成搜索策略', desc: '为每条主张生成多维度搜索查询' },
  { id: 'search',  icon: '🌐', name: '多源证据检索', desc: '模拟检索官方、主流媒体、专业来源' },
  { id: 'verify',  icon: '⚖️', name: '交叉比对验证', desc: '对比各来源，识别冲突与一致性' },
  { id: 'report',  icon: '📊', name: '生成核查报告', desc: '输出结构化评分与最终结论' },
];

function renderSteps(activeId, doneIds = [], errorId = null) {
  document.getElementById('stepsList').innerHTML = STEPS.map(s => {
    const isDone = doneIds.includes(s.id);
    const isActive = s.id === activeId;
    const isError = s.id === errorId;
    let cls = 'step';
    let statusHtml = '<span class="step-status">等待中</span>';
    if (isDone) { cls += ' done'; statusHtml = '<span class="step-status">✓ 完成</span>'; }
    if (isActive) { cls += ' active'; statusHtml = '<div class="spinner"></div>'; }
    if (isError) { cls += ' error'; statusHtml = '<span class="step-status">✗ 失败</span>'; }
    return `<div class="${cls}">
      <div class="step-icon">${s.icon}</div>
      <div class="step-info">
        <div class="step-name">${s.name}</div>
        <div class="step-desc">${s.desc}</div>
      </div>
      ${statusHtml}
    </div>`;
  }).join('');
}

// ===== 主流程 =====
async function startCheck() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { alert('请先输入智谱 API Key'); return; }
  localStorage.setItem('fce_apikey', apiKey);
  const tavilyKey = document.getElementById('tavilyKey').value.trim();
  if (tavilyKey) localStorage.setItem('fce_tavilykey', tavilyKey);

  const isImage = state.inputMode === 'image';
  if (isImage && !state.imageBase64) { alert('请先上传图片'); return; }
  const text = document.getElementById('textInput').value.trim();
  if (!isImage && !text) { alert('请输入需要核查的内容'); return; }

  showPanel('progressPanel');
  const done = [];

  try {
    // Step 1: 提取内容
    renderSteps('extract', done);
    let rawText = text;
    if (isImage) {
      rawText = await callGLM(apiKey, buildOCRPrompt(), null, state.imageBase64);
    }
    done.push('extract');

    // Step 2: 拆解主张
    renderSteps('claims', done);
    const claimsJson = await callGLM(apiKey, buildClaimsPrompt(rawText, state.category));
    const claimsData = parseJSON(claimsJson);
    done.push('claims');

    // Step 3: 生成搜索策略
    renderSteps('queries', done);
    const queriesJson = await callGLM(apiKey, buildQueriesPrompt(claimsData));
    const queriesData = parseJSON(queriesJson);
    done.push('queries');

    // Step 4: 多源检索
    renderSteps('search', done);
    let searchData;
    if (tavilyKey) {
      // 真实联网检索
      searchData = await tavilySearch(tavilyKey, claimsData, queriesData);
    } else {
      // 降级：AI 知识库模拟（来源为训练数据，非实时）
      const searchJson = await callGLM(apiKey, buildSearchPrompt(rawText, claimsData, queriesData));
      searchData = parseJSON(searchJson);
      searchData._simulated = true;
    }
    done.push('search');

    // Step 5: 交叉比对
    renderSteps('verify', done);
    const verifyJson = await callGLM(apiKey, buildVerifyPrompt(claimsData, searchData));
    const verifyData = parseJSON(verifyJson);
    done.push('verify');

    // Step 6: 生成报告
    renderSteps('report', done);
    const reportJson = await callGLM(apiKey, buildReportPrompt(rawText, claimsData, searchData, verifyData, state.category));
    const reportData = parseJSON(reportJson);
    done.push('report');
    renderSteps(null, done);

    // 渲染报告
    renderReport(rawText, claimsData, searchData, verifyData, reportData, isImage);
    saveHistory(
      rawText.slice(0, 30) + (rawText.length > 30 ? '...' : ''),
      reportData.verdict,
      reportData.score?.total || 0
    );

  } catch (err) {
    console.error(err);
    document.querySelector('.progress-title').textContent = '核查失败：' + err.message;
  }
}

// ===== GLM API 调用 =====
async function callGLM(apiKey, prompt, systemMsg, imageBase64) {
  const messages = [];
  if (systemMsg) messages.push({ role: 'system', content: systemMsg });

  if (imageBase64) {
    const mime = state.imageMime || 'image/jpeg';
    messages.push({
      role: 'user',
      content: [
        { type: 'image_url', image_url: { url: 'data:' + mime + ';base64,' + imageBase64 } },
        { type: 'text', text: prompt }
      ]
    });
  } else {
    messages.push({ role: 'user', content: prompt });
  }

  const res = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({ model: 'glm-5', messages, temperature: 0.1, max_tokens: 4000 })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = err.error?.message || err.message || JSON.stringify(err) || res.statusText;
    throw new Error(msg + ' (HTTP ' + res.status + ')');
  }
  const data = await res.json();
  return data.choices[0].message.content;
}

// ===== Tavily 真实搜索 =====
async function tavilySearch(tavilyKey, claimsData, queriesData) {
  const sources = [];
  let sid = 1;

  // 为每条主张执行搜索
  for (const claimQueries of (queriesData.queries || [])) {
    const claimId = claimQueries.claim_id;
    // 每条主张取前2个 query 执行，避免请求过多
    const qs = (claimQueries.queries || []).slice(0, 2);

    for (const q of qs) {
      try {
        const result = await tavilyRequest(tavilyKey, q.query);
        for (const r of (result.results || []).slice(0, 3)) {
          sources.push({
            id: 's' + sid++,
            claim_id: claimId,
            name: r.title || extractDomain(r.url),
            type: classifySource(r.url),
            tier: getTier(r.url),
            title: r.title || '',
            snippet: r.content ? r.content.slice(0, 200) : '',
            date: r.published_date || null,
            url: r.url,
            supports_claim: 'unknown', // 由后续 GLM 分析判断
            credibility: getTier(r.url) <= 2 ? 'high' : 'medium',
            notes: '来源：Tavily 真实检索'
          });
        }
      } catch (e) {
        console.warn('Tavily 搜索失败:', q.query, e.message);
      }
    }
  }

  return { sources, _simulated: false };
}

async function tavilyRequest(tavilyKey, query) {
  const res = await fetch('https://api.tavily.com/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      api_key: tavilyKey,
      query,
      search_depth: 'basic',
      max_results: 5,
      include_answer: false,
      include_raw_content: false
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || err.message || 'Tavily 请求失败 HTTP ' + res.status);
  }
  return res.json();
}

function extractDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch { return url; }
}

function classifySource(url) {
  const domain = extractDomain(url).toLowerCase();
  if (/gov\.|mil\.|xinhua|people\.com|cctv|mfa\.gov|pbc\.gov/.test(domain)) return '官方';
  if (/reuters|bloomberg|bbc|ap\.org|nytimes|wsj|ft\.com|caixin|thepaper|jiemian/.test(domain)) return '主流媒体';
  if (/wikipedia|britannica/.test(domain)) return '百科';
  return '专业媒体';
}

function getTier(url) {
  const domain = extractDomain(url).toLowerCase();
  if (/gov\.|mil\.|xinhua|people\.com|cctv|mfa\.gov|pbc\.gov|ap\.org/.test(domain)) return 1;
  if (/reuters|bloomberg|bbc|nytimes|wsj|ft\.com|caixin|thepaper|jiemian/.test(domain)) return 2;
  return 3;
}

function parseJSON(text) {
  const match = text.match(/```(?:json)?\s*([\s\S]*?)```/) || text.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
  if (match) {
    try { return JSON.parse(match[1] || match[0]); } catch(e) {}
  }
  try { return JSON.parse(text); } catch(e) {}
  throw new Error('无法解析 AI 返回的 JSON：' + text.slice(0, 200));
}

// ===== Prompt 构建 =====
function buildOCRPrompt() {
  return `请仔细识别这张图片中的所有文字内容。
要求：
1. 完整提取图片中的所有文字，包括标题、正文、时间、来源、作者等
2. 保留原始格式和段落结构
3. 如果是截图，注明来源平台（如：微信、微博、公众号、新闻网站等）
4. 直接输出提取的文字内容，不要添加额外说明`;
}

function buildClaimsPrompt(text, category) {
  return `你是一位专业的事实核查分析师。请分析以下内容，提取其中的可验证事实主张。

待核查内容：
"""
${text}
"""

核查类型：${category === 'auto' ? '自动识别' : category}

请将内容拆解为3~6个独立的、可验证的子主张。每个主张应该：
- 具体、明确，可以独立核查
- 包含关键实体（人物、机构、地点、时间、数字等）
- 不重叠、不冗余

请以JSON格式返回：
\`\`\`json
{
  "summary": "原消息摘要（50字以内）",
  "category": "主题分类（军事/金融/能源/社会/政策/其他）",
  "claims": [
    {
      "id": 1,
      "text": "主张内容",
      "entities": ["关键实体1", "关键实体2"],
      "verifiable": true,
      "priority": "high/medium/low"
    }
  ]
}
\`\`\``;
}

function buildQueriesPrompt(claimsData) {
  const claimsList = claimsData.claims.map(c => `${c.id}. ${c.text}`).join('\n');
  return `你是一位专业的信息检索专家。针对以下事实主张，生成最优的搜索查询策略。

主张列表：
${claimsList}

请为每条主张生成2~3个搜索查询，覆盖：
- 中文权威来源查询
- 英文国际来源查询（如适用）
- 针对关键实体的精确查询

请以JSON格式返回：
\`\`\`json
{
  "queries": [
    {
      "claim_id": 1,
      "queries": [
        {"lang": "zh", "query": "搜索词", "target": "官方/主流媒体/专业媒体"},
        {"lang": "en", "query": "search terms", "target": "international"}
      ]
    }
  ]
}
\`\`\``;
}

function buildSearchPrompt(rawText, claimsData, queriesData) {
  const claimsList = claimsData.claims.map(c => `${c.id}. ${c.text}`).join('\n');
  return `你是一位资深的信息核查研究员，拥有广泛的知识库。请基于你的知识，模拟对以下主张进行多源信息检索。

原始内容摘要：${claimsData.summary}

待核查主张：
${claimsList}

请模拟从以下来源检索相关信息：
- 第一层：政府官网、官方机构、权威通讯社（新华社、路透社、AP等）
- 第二层：主流媒体（央视、人民日报、财新、BBC、Bloomberg等）
- 第三层：专业垂直媒体（行业网站、专业数据库）
- 第四层：社交媒体（仅作参考）

重要原则：
1. 基于你的实际知识给出信息，不要编造不存在的事件
2. 如果某主张超出你的知识范围，明确标注"知识库无相关记录"
3. 注意时间线，标注信息的大致时间
4. 区分已知事实与推测

请以JSON格式返回：
\`\`\`json
{
  "sources": [
    {
      "id": "s1",
      "claim_id": 1,
      "name": "来源名称",
      "type": "官方/主流媒体/专业媒体/社交媒体",
      "tier": 1,
      "title": "相关报道/信息标题",
      "snippet": "关键内容摘要（100字以内）",
      "date": "发布时间（如已知）",
      "url": "来源URL（如已知，否则填null）",
      "supports_claim": "yes/no/partial/unknown",
      "credibility": "high/medium/low",
      "notes": "补充说明"
    }
  ],
  "knowledge_gaps": ["无法从知识库确认的主张ID列表"]
}
\`\`\``;
}

function buildVerifyPrompt(claimsData, searchData) {
  return `你是一位严谨的事实核查编辑。请基于检索到的证据，对每条主张进行交叉验证分析。

主张列表：
${JSON.stringify(claimsData.claims, null, 2)}

检索到的证据：
${JSON.stringify(searchData.sources, null, 2)}

请进行严格的交叉验证，分析：
1. 哪些主张被权威来源证实
2. 哪些主张存在来源冲突
3. 哪些主张缺乏足够证据
4. 是否存在时间线错配、旧闻复用、实体信息不一致等问题

请以JSON格式返回：
\`\`\`json
{
  "claim_verdicts": [
    {
      "claim_id": 1,
      "status": "confirmed/doubt/insufficient/false",
      "supporting_sources": ["s1", "s2"],
      "conflicting_sources": [],
      "analysis": "详细分析（100字以内）",
      "issues": ["时间线问题/实体不一致/旧闻复用等，如有"]
    }
  ],
  "confirmed_facts": ["已确认的事实描述"],
  "doubtful_info": ["存疑信息描述"],
  "insufficient_evidence": ["证据不足的主张描述"],
  "conflicts": [
    {
      "claim_id": 1,
      "description": "冲突描述",
      "source_a": "支持方来源",
      "source_b": "反对方来源",
      "resolution": "建议采信哪方及原因"
    }
  ]
}
\`\`\``;
}

function buildReportPrompt(rawText, claimsData, searchData, verifyData, category) {
  const confirmedCount = verifyData.claim_verdicts?.filter(v => v.status === 'confirmed').length || 0;
  const totalCount = claimsData.claims?.length || 1;
  return `你是一位权威的事实核查报告撰写专家。请基于以下核查数据，生成最终核查报告。

核查摘要：${claimsData.summary}
已确认主张：${confirmedCount}/${totalCount}
核查类型：${category}

验证结果：
${JSON.stringify(verifyData, null, 2)}

请生成最终报告，包含：
1. 可信度评分（严格按证据打分，不要虚高）
2. 最终结论
3. 核心理由（3~5条）
4. 反向验证建议（2~3条）

评分维度（严格评分）：
- source_authority: 来源权威性（0-30）：有官方来源30，主流媒体20，专业媒体15，仅社媒5
- multi_source: 多源印证度（0-25）：3+来源一致25，2来源15，单一来源8，无来源0
- timeline: 时间线一致性（0-15）：完全一致15，基本一致10，有疑问5，明显错误0
- entity: 实体信息一致性（0-15）：完全一致15，基本一致10，有出入5，明显错误0
- evidence: 关键证据完整性（0-15）：证据充分15，基本充分10，部分缺失5，严重缺失0

最终结论映射：
- 80-100 → "高可信"
- 60-79 → "基本可信，建议补充证据"
- 40-59 → "存疑"
- 20-39 → "高度存疑"
- 0-19 → "大概率虚假"
- 证据严重不足 → "证据不足，暂无法判定"

请以JSON格式返回：
\`\`\`json
{
  "score": {
    "source_authority": 0,
    "multi_source": 0,
    "timeline": 0,
    "entity": 0,
    "evidence": 0,
    "total": 0
  },
  "verdict": "最终结论",
  "verdict_level": "high/partial/doubt/false/unknown",
  "reasons": ["理由1", "理由2", "理由3"],
  "suggestions": ["建议1", "建议2", "建议3"]
}
\`\`\``;
}

// ===== 报告渲染 =====
function renderReport(rawText, claimsData, searchData, verifyData, reportData, isImage) {
  const verdictClass = {
    high: 'verdict-high', partial: 'verdict-partial',
    doubt: 'verdict-doubt', false: 'verdict-false', unknown: 'verdict-unknown'
  }[reportData.verdict_level] || 'verdict-unknown';

  const statusMap = {
    confirmed: ['status-confirmed', '✓ 已确认'],
    doubt: ['status-doubt', '⚠ 存疑'],
    insufficient: ['status-insufficient', '? 证据不足'],
    false: ['status-false', '✗ 不实']
  };

  const tierLabel = { 1: ['tier-1','官方权威'], 2: ['tier-2','主流媒体'], 3: ['tier-3','专业媒体'], 4: ['tier-4','社交媒体'] };
  const supportLabel = { yes: ['support-yes','支持'], no: ['support-no','反对'], partial: ['support-partial','部分支持'], unknown: ['','未知'] };

  const scoreItems = [
    { key: 'source_authority', label: '来源权威性', max: 30 },
    { key: 'multi_source', label: '多源印证度', max: 25 },
    { key: 'timeline', label: '时间线一致性', max: 15 },
    { key: 'entity', label: '实体信息一致性', max: 15 },
    { key: 'evidence', label: '关键证据完整性', max: 15 },
  ];

  const total = reportData.score?.total || 0;
  const scoreColor = total >= 80 ? 'var(--green)' : total >= 60 ? 'var(--blue)' : total >= 40 ? 'var(--yellow)' : total >= 20 ? 'var(--orange)' : 'var(--red)';

  const claimVerdicts = {};
  (verifyData.claim_verdicts || []).forEach(v => { claimVerdicts[v.claim_id] = v; });

  const sourceMap = {};
  (searchData.sources || []).forEach(s => { sourceMap[s.id] = s; });

  const confirmedCnt = (verifyData.claim_verdicts||[]).filter(v => v.status === 'confirmed').length;
  const doubtCnt = (verifyData.claim_verdicts||[]).filter(v => v.status === 'doubt').length;
  const insuffCnt = (verifyData.claim_verdicts||[]).filter(v => v.status === 'insufficient').length;
  const falseCnt = (verifyData.claim_verdicts||[]).filter(v => v.status === 'false').length;

  const html = `
  <div class="report-header">
    <div class="report-title-area">
      <div class="report-title">核查报告</div>
      <div class="report-meta">
        <div class="report-meta-item">输入类型：<span>${isImage ? '图片' : '文字'}</span></div>
        <div class="report-meta-item">主题分类：<span>${claimsData.category || '未知'}</span></div>
        <div class="report-meta-item">核查时间：<span>${new Date().toLocaleString('zh-CN')}</span></div>
        <div class="report-meta-item">主张数量：<span>${claimsData.claims?.length || 0} 条</span></div>
        <div class="report-meta-item">检索方式：<span style="color:${searchData._simulated ? 'var(--yellow)' : 'var(--green)'}">${searchData._simulated ? '⚠ AI知识库模拟（非实时）' : '✓ Tavily 真实联网检索'}</span></div>
      </div>
    </div>
    <div class="verdict-badge ${verdictClass}">${reportData.verdict}</div>
  </div>

  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">📋</span>
      <span class="section-title">核查摘要</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px">
      <div style="padding:12px 14px;background:var(--green-dim);border:1px solid var(--green);border-radius:var(--radius);text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--green)">${confirmedCnt}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">✓ 已确认</div>
      </div>
      <div style="padding:12px 14px;background:var(--yellow-dim);border:1px solid var(--yellow);border-radius:var(--radius);text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--yellow)">${doubtCnt}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">⚠ 存疑</div>
      </div>
      <div style="padding:12px 14px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:var(--radius);text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--blue)">${insuffCnt}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">? 证据不足</div>
      </div>
      <div style="padding:12px 14px;background:var(--red-dim);border:1px solid var(--red);border-radius:var(--radius);text-align:center">
        <div style="font-size:22px;font-weight:700;color:var(--red)">${falseCnt}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">✗ 不实</div>
      </div>
      <div style="padding:12px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);text-align:center">
        <div style="font-size:22px;font-weight:700;color:${scoreColor}">${total}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">综合评分</div>
      </div>
    </div>
    <div style="padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius)">
      <span style="font-size:12px;color:var(--text-muted)">内容摘要：</span>
      <span style="font-size:13px;color:var(--text-secondary)">${claimsData.summary || ''}</span>
    </div>
  </div>

  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">📄</span>
      <span class="section-title">原始内容</span>
    </div>
    <div class="original-text">${escHtml(rawText)}</div>
  </div>

  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">🔬</span>
      <span class="section-title">可验证主张拆解</span>
      <span class="section-count">${claimsData.claims?.length || 0} 条</span>
    </div>
    <div class="claims-list">
      ${(claimsData.claims || []).map(c => {
        const v = claimVerdicts[c.id] || {};
        const [sCls, sLabel] = statusMap[v.status] || ['status-insufficient', '? 待核查'];
        const suppIds = v.supporting_sources || [];
        const hasSources = suppIds.length > 0;

        const sourcesHtml = hasSources
          ? suppIds.map(sid => {
              const src = sourceMap[sid];
              if (!src) return '';
              return `<div style="display:flex;align-items:center;gap:6px;margin-top:5px">
                <span style="color:var(--green);font-weight:700;font-size:14px;flex-shrink:0">✓</span>
                <span style="font-size:12px;color:var(--text-secondary);flex:1">${escHtml(src.name || src.title || sid)}</span>
                ${src.url ? `<a href="${escHtml(src.url)}" target="_blank" style="font-size:11px;color:var(--blue);text-decoration:none;flex-shrink:0">查看来源 ↗</a>` : ''}
              </div>`;
            }).join('')
          : `<div style="display:flex;align-items:center;gap:6px;margin-top:5px">
              <span style="color:var(--red);font-weight:700;font-size:14px">✗</span>
              <span style="font-size:12px;color:var(--red)">无可信来源支撑，存疑</span>
            </div>`;

        return `<div class="claim-item">
          <div class="claim-num">${c.id}</div>
          <div class="claim-body">
            <div class="claim-text">${escHtml(c.text)}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
              <span class="claim-status ${sCls}">${sLabel}</span>
              ${(c.entities||[]).map(e => `<span style="font-size:11px;color:var(--text-muted);background:var(--bg-card);padding:1px 7px;border-radius:8px;border:1px solid var(--border)">${escHtml(e)}</span>`).join('')}
            </div>
            <div style="margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:6px;border:1px solid ${hasSources ? 'var(--green)' : 'var(--red)'};border-opacity:0.4">
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">${hasSources ? '来源依据：' : '来源状态：'}</div>
              ${sourcesHtml}
            </div>
            ${v.analysis ? `<div style="font-size:12px;color:var(--text-muted);margin-top:6px">${escHtml(v.analysis)}</div>` : ''}
            ${(v.issues||[]).length ? `<div style="font-size:11px;color:var(--orange);margin-top:4px">⚠ ${v.issues.join(' · ')}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>

  ${renderEvidenceSection('✅', '已确认事实', 'confirmed', verifyData.confirmed_facts || [], 'confirmed')}
  ${renderEvidenceSection('⚠️', '存疑信息', 'doubt', verifyData.doubtful_info || [], 'doubt')}
  ${renderEvidenceSection('❓', '证据不足', 'insufficient', verifyData.insufficient_evidence || [], 'insufficient')}

  ${(verifyData.conflicts||[]).length ? `
  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">⚡</span>
      <span class="section-title">来源冲突</span>
      <span class="section-count">${verifyData.conflicts.length} 处</span>
    </div>
    ${verifyData.conflicts.map(c => `
      <div style="padding:14px 16px;background:var(--bg-input);border:1px solid var(--orange);border-radius:var(--radius);margin-bottom:10px">
        <div style="font-size:13px;font-weight:600;color:var(--orange);margin-bottom:8px">主张 #${c.claim_id} 存在冲突</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">${escHtml(c.description)}</div>
        <div style="display:flex;gap:16px;font-size:12px">
          <span style="color:var(--green)">支持方：${escHtml(c.source_a||'')}</span>
          <span style="color:var(--red)">反对方：${escHtml(c.source_b||'')}</span>
        </div>
        ${c.resolution ? `<div style="font-size:12px;color:var(--text-muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">建议：${escHtml(c.resolution)}</div>` : ''}
      </div>
    `).join('')}
  </div>` : ''}

  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">📚</span>
      <span class="section-title">证据来源</span>
      <span class="section-count">${searchData.sources?.length || 0} 条</span>
    </div>
    <div style="overflow-x:auto">
      <table class="sources-table">
        <thead>
          <tr>
            <th>来源</th><th>类型</th><th>主张</th><th>态度</th><th>摘要</th><th>时间</th>
          </tr>
        </thead>
        <tbody>
          ${(searchData.sources||[]).map(s => {
            const [tCls, tLabel] = tierLabel[s.tier] || ['tier-3','未知'];
            const [spCls, spLabel] = supportLabel[s.supports_claim] || ['','未知'];
            return `<tr>
              <td>
                <div class="source-name">${escHtml(s.name)}</div>
                ${s.url ? `<a class="source-link" href="${escHtml(s.url)}" target="_blank">查看来源 ↗</a>` : ''}
              </td>
              <td><span class="source-tier ${tCls}">${tLabel}</span></td>
              <td style="color:var(--text-muted)">#${s.claim_id}</td>
              <td><span class="${spCls}">${spLabel}</span></td>
              <td style="max-width:280px;color:var(--text-secondary)">${escHtml(s.snippet||'')}</td>
              <td style="color:var(--text-muted);white-space:nowrap">${escHtml(s.date||'未知')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">📊</span>
      <span class="section-title">可信度评分</span>
    </div>
    <div class="score-panel">
      ${scoreItems.map(item => {
        const val = reportData.score?.[item.key] || 0;
        const pct = (val / item.max * 100).toFixed(0);
        const color = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--yellow)' : 'var(--red)';
        return `<div class="score-item">
          <div class="score-label">${item.label}（满分${item.max}）</div>
          <div class="score-bar-wrap">
            <div class="score-bar-bg">
              <div class="score-bar-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            <div class="score-val" style="color:${color}">${val}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="score-total">
      <div>
        <div class="score-total-label">综合可信度</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${getScoreDesc(total)}</div>
      </div>
      <div class="score-total-val" style="color:${scoreColor}">${total}<span style="font-size:14px;color:var(--text-muted)">/100</span></div>
    </div>
  </div>

  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">🏁</span>
      <span class="section-title">最终结论</span>
    </div>
    <div class="conclusion-box">
      <div class="conclusion-verdict">
        <span class="verdict-badge ${verdictClass}">${reportData.verdict}</span>
      </div>
      <div class="conclusion-reasons">
        ${(reportData.reasons||[]).map((r,i) => `
          <div class="conclusion-reason">
            <span class="reason-num">${i+1}.</span>
            <span>${escHtml(r)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  </div>

  <div class="report-section">
    <div class="section-header">
      <span class="section-icon">🔭</span>
      <span class="section-title">反向验证建议</span>
    </div>
    <div class="suggestions-list">
      ${(reportData.suggestions||[]).map(s => `
        <div class="suggestion-item">
          <span class="suggestion-icon">→</span>
          <span>${escHtml(s)}</span>
        </div>
      `).join('')}
    </div>
  </div>

  <div class="report-actions">
    <button class="action-btn btn-primary" onclick="exportPDF()">📄 导出 PDF</button>
    <button class="action-btn btn-secondary" onclick="newCheck()">🔄 新建核查</button>
    <button class="action-btn btn-secondary" onclick="copyReport()">📋 复制摘要</button>
  </div>`;

  document.getElementById('reportPanel').innerHTML = html;
  showPanel('reportPanel');
}

function renderEvidenceSection(icon, title, type, items, cls) {
  if (!items.length) return '';
  return `<div class="report-section">
    <div class="section-header">
      <span class="section-icon">${icon}</span>
      <span class="section-title">${title}</span>
      <span class="section-count">${items.length} 条</span>
    </div>
    ${items.map(item => `
      <div class="evidence-block ${cls}">
        <div class="evidence-detail">${escHtml(item)}</div>
      </div>
    `).join('')}
  </div>`;
}

function getScoreDesc(score) {
  if (score >= 80) return '高可信 — 有充分权威来源支撑';
  if (score >= 60) return '基本可信 — 建议补充更多证据';
  if (score >= 40) return '存疑 — 证据不充分或存在冲突';
  if (score >= 20) return '高度存疑 — 缺乏可信来源支撑';
  return '大概率虚假 — 与权威来源严重冲突';
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 操作 =====
function newCheck() {
  state.imageBase64 = null;
  state.imageFile = null;
  state.imageMime = null;
  document.getElementById('textInput').value = '';
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('uploadPlaceholder').style.display = 'flex';
  document.getElementById('imageStatus').textContent = '未选择图片';
  document.getElementById('checkBtnImg').disabled = true;
  updateCharCount();
  showPanel('inputPanel');
}

function exportPDF() {
  const actions = document.querySelector('.report-actions');
  const main = document.querySelector('.main');
  const reportPanel = document.getElementById('reportPanel');

  // 临时展开所有滚动容器
  const prevMainOverflow = main.style.overflow;
  const prevMainHeight = main.style.height;
  const prevPanelOverflow = reportPanel.style.overflow;
  const prevPanelHeight = reportPanel.style.height;

  if (actions) actions.style.display = 'none';
  main.style.overflow = 'visible';
  main.style.height = 'auto';
  reportPanel.style.overflow = 'visible';
  reportPanel.style.height = 'auto';

  window.print();

  setTimeout(() => {
    if (actions) actions.style.display = 'flex';
    main.style.overflow = prevMainOverflow;
    main.style.height = prevMainHeight;
    reportPanel.style.overflow = prevPanelOverflow;
    reportPanel.style.height = prevPanelHeight;
  }, 1000);
}

function copyReport() {
  const panel = document.getElementById('reportPanel');
  const text = panel.innerText;
  navigator.clipboard.writeText(text).then(() => {
    alert('报告已复制到剪贴板');
  }).catch(() => {
    alert('复制失败，请手动选择文字复制');
  });
}

function showHistoryItem(i) {
  alert('历史记录功能：当前版本仅保存标题和评分，完整报告需重新核查。');
}
